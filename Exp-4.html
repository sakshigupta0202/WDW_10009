<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-4</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post">
        <div>
        <label for="Fullname">Full Name:</label>
        <input type="text" id="Fullname" name="Fullname" required>
        <br><br>
        <label for="Email">Email:</label>
        <input type="text" id="Email" required>
        <br><br>
        <label for="Phone">Phone No:</label>
        <input type="text" id="Phone" required>
        <br><br>
        <label for="Checkin">Checkin:</label>
        <input type="date" id="Checkin" required>
        <br><br>
        <label for="Checkout">Checkout:</label>
        <input type="date" id="Checkout" required>
        <br><br>
        <!--Room Type-->
        <label for="Roomtype">Roomtype:</label> 
        <select id="Roomtype" required>
            <option value="">Select Room Type</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
            </select>
        <br><br>
        <label for="Guests">Number of Guests:</label>
        <input type="number" id="Guests" min="1" max="10" required>
        <br><br>
        <label for="Special_Requests">Special Requests:</label><br>
        <textarea id="Special_Requests" rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit now">
        <input type="reset" value="Reset now">
        <br><br>
        </div>
        


            </form>
            </body>




    
</body>
</html>
